# 目标机部署编排（单容器，无需数据库）
# 放置路径：/data/cicd-demo/docker-compose.yml

services:
  web:
    image: ${IMAGE}:${TAG}
    container_name: poker-web
    restart: unless-stopped
    environment:
      # 会话签名密钥，多副本部署时必须一致
      SECRET_KEY: ${SECRET_KEY}
      TZ: Asia/Shanghai
    ports:
      - "8080:5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:5000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
